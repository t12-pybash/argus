[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-sre"
version = "0.2.1"
requires-python = ">=3.11"
description = "Autonomous SRE intelligence for sovereign infrastructure"
license = {text = "Apache-2.0"}
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tomllib; python_version < '3.11'",
]

[project.scripts]
argus = "argus.main:app"
argus-mcp = "argus.mcp_server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[project.optional-dependencies]
rag = ["qdrant-client>=1.9"]
agent = ["confluent-kafka>=2.3", "watchdog>=4.0"]
mcp = ["mcp[cli]>=1.0"]
all = ["argus-sre[rag,agent,mcp]"]
dev = ["commitizen>=3.0", "ruff>=0.4"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.1"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.ruff]
line-length = 100
target-version = "py311"
