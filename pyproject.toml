[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tomllib; python_version < '3.11'",
]

[project.scripts]
sre = "sre.main:app"

[tool.hatch.build.targets.wheel]
packages = ["sre"]
